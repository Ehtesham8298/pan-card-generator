services:
  - type: web
    name: pan-card-generator
    runtime: python
    repo: https://github.com/Ehtesham8298/pan-card-generator.git
    branch: master
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn pan_form:app --bind 0.0.0.0:$PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
